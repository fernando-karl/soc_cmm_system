services:
  soc-cmm:
    build: .
    # Map host:container. Override on the host with: PORT=9000 docker compose up
    ports:
      - "${PORT:-8400}:8400"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Keep the database inside the mounted volume below, otherwise it lands in
      # the image layer and is lost on every rebuild.
      - DB_PATH=/app/data/soc_cmm_bilingual.db
      # SECRET_KEY and ADMIN_PASSWORD must come from .env (see .env.example).
      # The application aborts on startup if SECRET_KEY is not set.
      # The container always listens on 8400; only the host port moves. If you
      # publish it on a different host port and something cross-origin calls the
      # API, set ALLOWED_ORIGINS in .env to the URL the browser actually uses —
      # the default is derived from the port inside the container.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-8400}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
