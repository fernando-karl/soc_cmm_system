name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m compileall -q \
            auth.py database.py main.py mcp_server.py \
            scripts/migrate_to_auth.py scripts/run_admin_migration.py

      - name: Import smoke check
        env:
          SECRET_KEY: ci-smoke-secret-key-not-for-production
        run: |
          python -c "import auth; import database; print('imports_ok')"
